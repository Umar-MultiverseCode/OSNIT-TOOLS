<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="415" viewBox="0 0 1200 415" role="img" aria-label="02 / FROM A LINK TO YOUR OWN TOOLKIT"><rect width="1200" height="415" fill="#101411" stroke="#354337"/><text x="32" y="46" fill="#a8e381" font-family="monospace" font-size="18">02 / FROM A LINK TO YOUR OWN TOOLKIT</text><text x="32" y="80" fill="#97a98f" font-family="Arial" font-size="17">The website turns the catalogue into a small, personal research desk.</text><rect x="25" y="110" width="1150" height="78" fill="#171d18" stroke="#354337"/><text x="45" y="141" fill="#ed633c" font-family="monospace" font-size="17">DISCOVER</text><text x="45" y="169" fill="#e8eee3" font-family="Arial" font-size="18">Search by topic, tool name or creator. Narrow by category and resource type.</text><rect x="25" y="205" width="1150" height="78" fill="#171d18" stroke="#354337"/><text x="45" y="236" fill="#ed633c" font-family="monospace" font-size="17">INSPECT</text><text x="45" y="264" fill="#e8eee3" font-family="Arial" font-size="18">Open field notes. Check the original repository, creator and license reference.</text><rect x="25" y="300" width="1150" height="78" fill="#171d18" stroke="#354337"/><text x="45" y="331" fill="#ed633c" font-family="monospace" font-size="17">SAVE + SHARE</text><text x="45" y="359" fill="#e8eee3" font-family="Arial" font-size="18">Bookmark in your browser. Export JSON. Share a URL with your filters.</text></svg>